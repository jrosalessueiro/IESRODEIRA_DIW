<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Proyecto de Javascript</title>
    <!-- Enlace al archivo CSS que creamos antes -->
    <link rel="stylesheet" type="text/css" href="estilos.css">
</head>

<body>

    <!-- Selector de colores lateral (fijo) -->
    <div id="seleccion">
        <div id="verde"></div>
        <div id="rojo"></div>
        <div id="azul"></div>
    </div>

    <header>
        <div id="logo">
            <h1>SASS</h1>
        </div>

        <nav id="menu">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Reloj</a></li>
                <li><a href="#">Sobre mí</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor principal que centra el contenido blanco -->
    <div id="global">
        <section id="content1">
            <h2>Main</h2>
            <div class="container">
                <div class="full-image cielo"></div>
                <div class="full-image rojas"></div>
            </div>
        </section>

        <aside id="sidebar">
            <h4><span>¿Quién soy?</span></h4>
            <img src="img/caracol.jpg" alt="Caracol">
            <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nam sit amet malesuada erat. ad uliamoper
                justo.
            </p>

            <h4><span>Identifícate</span></h4>
            <div id="login">
                <form>
                    <label>Nombre de usuario:</label>
                    <input type="text" name="user">

                    <label>Correo:</label>
                    <input type="text" name="email">

                    <label>Contraseña:</label>
                    <input type="password" name="pass">

                    <input type="submit" value="Entrar">
                </form>
            </div>
        </aside>

        <!-- Limpiamos los floats para que el footer no se descoloque -->
        <div class="clearfix"></div>

    </div> <!-- Fin #global -->

    <footer>
        <div class="caja_uno">
            <h1>PRIMERO</h1>
        </div>
        <div class="caja_dos">
            <h2>SEGUNDO</h2>
        </div>
        <div class="caja_tres">
            <h3>TERCERO</h3>
        </div>
    </footer>

</body>

</html>
